name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Java Web App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build WAR with Maven
        run: mvn -B verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: studypal-war
          path: target/studypal.war
          if-no-files-found: error

  database-scripts:
    name: Validate MySQL Scripts
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Wait for MySQL
        env:
          MYSQL_PWD: root
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Load schema
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -uroot < sql/schema.sql

      - name: Load database objects
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot < sql/views.sql
          mysql -h 127.0.0.1 -uroot < sql/triggers.sql
          mysql -h 127.0.0.1 -uroot < sql/procedures.sql

      - name: Load test data
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -uroot < sql/insert_test_data.sql

      - name: Run query examples
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -uroot < sql/queries.sql
