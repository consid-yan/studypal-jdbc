<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedule - StudyPal</title>
    <link rel="stylesheet" href="../src/main/webapp/assets/css/style.css">
</head>
<body>
<header class="app-header">
    <h1><a href="index.html">StudyPal</a></h1>
    <nav>
        <a href="courses.html">Courses</a>
        <a href="main-tasks.html">Main Tasks</a>
        <a href="sub-tasks.html">Sub Tasks</a>
        <a href="schedule.html">Schedule</a>
        <a href="study-sessions.html">Study Sessions</a>
    </nav>
</header>

<main class="page">
    <div class="page-header">
        <h2>Schedule</h2>
        <form class="filter-form">
            <label>Date</label>
            <input type="date" value="2026-05-21">
            <button type="button" class="btn btn-sm">Filter</button>
            <a class="btn btn-sm" href="schedule.html">Show All</a>
        </form>
    </div>

    <table class="data-table">
        <thead>
        <tr><th>Date</th><th>Start</th><th>End</th><th>Type</th><th>Title</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr>
            <td>2026-05-21</td>
            <td>10:00</td>
            <td>12:00</td>
            <td><span class="badge badge-slot-class">CLASS</span></td>
            <td>COMP2015J Tutorial</td>
            <td class="action-cell"><button class="btn btn-sm">Edit</button><button class="btn btn-sm btn-danger">Delete</button></td>
        </tr>
        <tr>
            <td>2026-05-21</td>
            <td>16:00</td>
            <td>18:00</td>
            <td><span class="badge badge-slot-free">FREE</span></td>
            <td>Study Time</td>
            <td class="action-cell"><button class="btn btn-sm">Edit</button><button class="btn btn-sm btn-danger">Delete</button></td>
        </tr>
        </tbody>
    </table>

    <div class="form-card">
        <h3>Add Schedule Slot</h3>
        <div class="form-row">
            <div class="form-group"><label>Date</label><input type="date"></div>
            <div class="form-group"><label>Start Time</label><input type="time"></div>
            <div class="form-group"><label>End Time</label><input type="time"></div>
        </div>
        <div class="form-actions"><button type="button" class="btn btn-primary">Add Slot</button></div>
    </div>
</main>
</body>
</html>
